services:
  - type: web
    name: sckit-learn-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    envVars:
      - key: WEB_ORIGIN
        sync: false
      - key: SESSION_TTL_MINUTES
        value: 30
      - key: EXEC_TIMEOUT_SECONDS
        value: 5
      - key: MAX_UPLOAD_BYTES
        value: 5242880
    healthCheckPath: /health
